name: 功能建议
description: 提议新的统计能力、交互方式或兼容性改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述当前使用中的具体不便，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望怎样操作、看到什么结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 统计口径或数据读取
        - 桌面宠物与通知
        - 统计面板与图表
        - 安装、更新或兼容性
        - 文档与仓库协作
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私原则
      options:
        - label: 建议不需要上传会话内容或引入静默遥测
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议
          required: true
