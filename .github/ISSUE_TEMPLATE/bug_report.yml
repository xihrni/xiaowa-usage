name: 问题反馈
description: 报告启动、统计、界面、安装或兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认问题可以复现，并删除截图和日志中的真实会话标题、数据库路径和个人信息。
  - type: input
    id: app-version
    attributes:
      label: 小哇版本
      description: 设置页“版本与更新”中显示的版本，或安装包文件名。
      placeholder: "例如 v0.1.0"
    validations:
      required: true
  - type: input
    id: workbuddy-version
    attributes:
      label: WorkBuddy 版本
      description: 如不确定可填写“未知”。
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "例如 Windows 11 24H2 x64"
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: 安装方式
      options:
        - 安装版 Setup EXE
        - 便携版 ZIP
        - 源码运行 npm start
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请用编号列出操作步骤。
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以附脱敏截图，但不要上传数据库或完整会话文件。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误提示或日志
      description: 请先删除用户名、会话标题、令牌和其他敏感信息。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含真实会话标题、数据库、令牌或个人敏感信息
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
