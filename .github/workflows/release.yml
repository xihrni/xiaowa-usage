name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer and portable package
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist

      - name: Verify Windows signatures
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          $targets = @(
            "release-builder/WorkBuddyPet-Setup-$((Get-Content 'package.json' -Raw | ConvertFrom-Json).version).exe",
            "release-builder/win-unpacked/WorkBuddyPet.exe"
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            Write-Host "$target -> $($signature.Status) / $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { throw "Invalid signature: $target" }
          }

      - name: Create portable package and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = $package.version
          $output = Join-Path $PWD "release-builder"
          $setup = Join-Path $output "WorkBuddyPet-Setup-$version.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer was not created: $setup"
          }

          $portableRoot = Join-Path $output "WorkBuddyPet"
          Copy-Item (Join-Path $output "win-unpacked") $portableRoot -Recurse -Force
          $portableZip = Join-Path $output "WorkBuddyPet-$version-win-x64.zip"
          Compress-Archive -Path $portableRoot -DestinationPath $portableZip -CompressionLevel Optimal

          $latest = Join-Path $output "latest.yml"
          if (-not (Test-Path $latest)) {
            throw "Update metadata was not created: $latest"
          }
          $blockmap = Join-Path $output "WorkBuddyPet-Setup-$version.exe.blockmap"
          if (-not (Test-Path $blockmap)) {
            throw "Update blockmap was not created: $blockmap"
          }

          $checksumFile = Join-Path $output "SHA256SUMS.txt"
          Get-FileHash $setup, $portableZip, $latest, $blockmap -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content $checksumFile -Encoding ascii

          Get-Item $setup, $portableZip, $latest, $blockmap, $checksumFile | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WorkBuddyPet-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-builder/WorkBuddyPet-Setup-*.exe
            release-builder/WorkBuddyPet-*-win-x64.zip
            release-builder/WorkBuddyPet-Setup-*.exe.blockmap
            release-builder/latest.yml
            release-builder/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-builder/WorkBuddyPet-Setup-*.exe
            release-builder/WorkBuddyPet-*-win-x64.zip
            release-builder/WorkBuddyPet-Setup-*.exe.blockmap
            release-builder/latest.yml
            release-builder/SHA256SUMS.txt
