name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer and portable package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist

      - name: Create portable package and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = $package.version
          $output = Join-Path $PWD "release-builder"
          $setup = Join-Path $output "WorkBuddyPet-Setup-$version.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer was not created: $setup"
          }

          $portableRoot = Join-Path $output "WorkBuddyPet"
          Copy-Item (Join-Path $output "win-unpacked") $portableRoot -Recurse -Force
          $portableZip = Join-Path $output "WorkBuddyPet-$version-win-x64.zip"
          Compress-Archive -Path $portableRoot -DestinationPath $portableZip -CompressionLevel Optimal

          $checksumFile = Join-Path $output "SHA256SUMS.txt"
          Get-FileHash $setup, $portableZip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content $checksumFile -Encoding ascii

          Get-Item $setup, $portableZip, $checksumFile | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyPet-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-builder/WorkBuddyPet-Setup-*.exe
            release-builder/WorkBuddyPet-*-win-x64.zip
            release-builder/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-builder/WorkBuddyPet-Setup-*.exe
            release-builder/WorkBuddyPet-*-win-x64.zip
            release-builder/SHA256SUMS.txt
